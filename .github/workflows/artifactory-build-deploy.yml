name: Artifactory Build and Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  attestations: write
  artifact-metadata: write

env:
  JF_PROJECT: webgoat
  BUILD_NAME: webgoat
  IMAGE_NAME: webgoat
  DOCKER_LOCAL_REPO: webgoat-docker-local
  MAVEN_LOCAL_REPO: webgoat-maven-local

jobs:
  build-and-deploy:
    name: Build and deploy to Artifactory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: ./.github/actions/java-setup
        with:
          cache: maven

      - name: Setup JFrog CLI
        id: setup-jfrog-cli
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ vars.JF_URL }}
          JF_PROJECT: ${{ env.JF_PROJECT }}
        with:
          oidc-provider-name: github-oidc-integration

      - name: Configure Maven for Artifactory
        run: |
          jf mvnc \
            --repo-resolve-releases webgoat-maven \
            --repo-resolve-snapshots webgoat-maven \
            --repo-deploy-releases webgoat-maven-local \
            --repo-deploy-snapshots webgoat-maven-local

      - name: Build and deploy Maven artifact
        run: |
          jf mvn clean deploy \
            --build-name="${BUILD_NAME}" \
            --build-number="${{ github.run_number }}" \
            --project="${JF_PROJECT}"

      - name: Resolve Maven artifact for attestation
        id: maven-artifact
        run: |
          set -euo pipefail
          JAR=$(find target -maxdepth 1 -type f -name 'webgoat-*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*.jar.original' | head -1)
          test -n "${JAR}"
          DIGEST="sha256:$(sha256sum "${JAR}" | awk '{print $1}')"
          SHA256="${DIGEST#sha256:}"

          # Discover the Artifactory path by checksum (handles unique SNAPSHOT timestamps)
          ARTIFACT_PATH=$(echo "items.find({\"repo\":\"${MAVEN_LOCAL_REPO}\",\"sha256\":\"${SHA256}\"}).include(\"repo\",\"path\",\"name\")" \
            | jf rt curl -XPOST /api/search/aql --data-binary @- \
            | jq -r '.results[] | select(.name | test("\\.jar$")) | select(.name | test("sources|javadoc") | not) | "\(.repo)/\(.path)/\(.name)"' \
            | head -1)
          test -n "${ARTIFACT_PATH}"

          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "path=${ARTIFACT_PATH}" >> "${GITHUB_OUTPUT}"
          echo "Attesting Maven artifact at ${ARTIFACT_PATH} (${DIGEST})"

      - name: Attest Maven artifact
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.maven-artifact.outputs.path }}
          subject-digest: ${{ steps.maven-artifact.outputs.digest }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker login to Artifactory
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.JF_DOCKER_REGISTRY }}
          username: ${{ steps.setup-jfrog-cli.outputs.oidc-user }}
          password: ${{ steps.setup-jfrog-cli.outputs.oidc-token }}

      - name: Build and push WebGoat image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ vars.JF_DOCKER_REGISTRY }}/${{ env.DOCKER_LOCAL_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ vars.JF_DOCKER_REGISTRY }}/${{ env.DOCKER_LOCAL_REPO }}/${{ env.IMAGE_NAME }}:latest

      - name: Attest Docker image
        uses: actions/attest-build-provenance@v3
        with:
          # oci:// prefix is required so JFrog Evidence correctly parses the subject
          subject-name: oci://${{ vars.JF_DOCKER_REGISTRY }}/${{ env.DOCKER_LOCAL_REPO }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}

      - name: Add Docker image to build-info
        run: |
          IMAGE_REF="${{ vars.JF_DOCKER_REGISTRY }}/${DOCKER_LOCAL_REPO}/${IMAGE_NAME}@${{ steps.build-and-push.outputs.digest }}"
          echo "${IMAGE_REF}" > image-ref.txt
          jf rt build-docker-create "${DOCKER_LOCAL_REPO}" \
            --image-file image-ref.txt \
            --build-name="${BUILD_NAME}" \
            --build-number="${{ github.run_number }}" \
            --project="${JF_PROJECT}"

      - name: Publish build-info
        run: |
          jf rt build-publish \
            "${BUILD_NAME}" \
            "${{ github.run_number }}" \
            --project="${JF_PROJECT}"
